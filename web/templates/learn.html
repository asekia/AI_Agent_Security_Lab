{% extends "base.html" %}
{% block title %}学习路径 · agent安全笔记{% endblock %}
{% block content %}
<h1>学习路径</h1>
<p class="muted">
  按顺序读文档。每条路径给出一组有序单元：该看哪篇、重点看什么。
</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}

<table class="asi-table">
  <tr><th style="width:26%;">路径</th><th style="width:10%;">单元</th><th>定位</th></tr>
  {% for pt in paths %}
  <tr>
    <td><a href="{{ url_for('learn_path_page', pid=pt.pid) }}">{{ pt.title }}</a>
        <span class="muted">· {{ pt.en }}</span></td>
    <td>{{ pt.total }}</td>
    <td>{{ pt.desc }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
