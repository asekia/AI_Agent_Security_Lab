{% extends "base.html" %}
{% block title %}{{ title }} · agent安全笔记{% endblock %}
{% block content %}
{% if error %}
  <h1>未知文档</h1>
  <p class="error">{{ error }}</p>
  <a class="btn" href="{{ url_for('index') }}">返回仪表盘</a>
{% else %}
<div class="principle-header">
  <h1>{{ title }}</h1>
</div>
<div class="principle-body">
  {{ body | safe }}
</div>
{% endif %}
{% endblock %}
