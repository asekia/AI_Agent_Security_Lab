{% extends "base.html" %}
{% block title %}{{ title }} · LangGraph 漏洞靶场{% endblock %}
{% block content %}
{% if error %}
  <h1>未知文档</h1>
  <p class="error">{{ error }}</p>
  <a class="btn" href="{{ url_for('index') }}">返回仪表盘</a>
{% else %}
<div class="principle-header">
  <h1>{{ title }}</h1>
</div>
<div class="principle-body">
  {{ body | safe }}
</div>
<p class="muted" style="margin-top:24px;">
  <a href="{{ url_for('asi_page', demo_id=doc_id) }}">进入 {{ doc_id | upper }} 演示</a>
  {% if doc_id == 'asi01' %}
  · <a href="{{ url_for('agent_page') }}">进入 Agent 框架</a>
  {% endif %}
</p>
{% endif %}
{% endblock %}
