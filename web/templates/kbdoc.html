{% extends "base.html" %}
{% block title %}{{ doc.title }} · LLM 安全知识库{% endblock %}
{% block content %}
<div class="principle-header">
  <h1>{{ doc.title }}</h1>
  <p class="muted">{{ doc.en }} · {{ doc.group_zh }}</p>
</div>
<div class="principle-body">
  {{ body | safe }}
</div>
<p class="muted" style="margin-top:24px;">
  <a href="{{ url_for('kbgroup', gid=doc.group) }}">← 返回「{{ doc.group_zh }}」分类</a>
  · <a href="{{ url_for('kbindex') }}">知识库总览</a>
</p>
{% endblock %}
